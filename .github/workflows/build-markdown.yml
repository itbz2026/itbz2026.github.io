name: Build Markdown articles and search index

on:
  push:
    branches: [main]
    paths:
      - "content/**/*.md"
      - "pages/**/*.html"
      - "!pages/generated/**"
      - "index.html"
      - "scripts/build.py"
      - ".github/workflows/build-markdown.yml"
      - "data/navigation.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Markdown renderer
        run: pip install Markdown

      - name: Build HTML pages and global search index
        run: python scripts/build.py

      - name: Commit generated pages and search index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/generated/ data/search-index.json
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Build HTML pages and global search index"
            git pull --rebase origin main
            git push
          fi
